<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>AI Desk Card</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=phase-5">
  </head>
  <body>
    <main class="desk-card" aria-live="polite">
      <header class="top-bar">
        <div>
          <p class="label">AI Desk Card</p>
          <h1 id="current-date">--</h1>
        </div>
        <div class="time-block">
          <time id="current-time">--:--</time>
          <p id="freshness">loading</p>
        </div>
      </header>

      <section class="glance-row" aria-label="Glance">
        <article class="widget weather-widget" id="widget-weather" aria-label="Weather"></article>
        <article class="widget ai-status-widget" id="widget-ai-status" aria-label="AI Status"></article>
      </section>

      <section class="widget focus-widget" id="widget-focus" aria-label="Focus"></section>

      <section class="detail-row" aria-label="Details">
        <article class="widget ai-tasks-widget" id="widget-ai-tasks" aria-label="AI Tasks"></article>
        <article class="widget band-widget" id="widget-calendar" aria-label="Calendar"></article>
        <article class="widget band-widget" id="widget-todo" aria-label="Todo"></article>
      </section>

      <footer class="footer-bar">
        <span id="source-label">source: widgets.json</span>
        <span id="refresh-label">refresh: 300s</span>
        <span id="status-label">status: loading</span>
      </footer>
    </main>

    <script src="./app.js?v=phase-5" defer></script>
  </body>
</html>
