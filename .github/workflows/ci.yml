name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run deterministic tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Compile Python
        run: python3 -m compileall -q scripts .codex/hooks .trellis/scripts deploy/scripts

      - name: Check JavaScript and shell syntax
        run: |
          node --check web/app.js
          for path in deploy/scripts/*.sh; do
            bash -n "$path"
          done

      - name: Parse JSON and plist files
        run: |
          python3 - <<'PY'
          import json
          import plistlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.run(
              ["git", "ls-files"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          for relative in tracked:
              path = Path(relative)
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              if path.name.endswith(".plist.example"):
                  with path.open("rb") as handle:
                      plistlib.load(handle)
          PY

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git show --check --format= HEAD
          fi
